name: verify

on:
  push:
  pull_request:

jobs:
  oracle:
    name: Oracle regression (fixtures pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r oracle/requirements.txt
      - name: Regenerate oracle output
        run: python oracle/run_oracle.py > /tmp/regen.json
      - name: Gate — oracle must byte-match fixtures/expected.json
        run: cmp /tmp/regen.json fixtures/expected.json

  engine:
    name: TS engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
        working-directory: engine
      - run: bun run test
        working-directory: engine
      - run: bun run typecheck
        working-directory: engine

  app:
    name: App gates (lexicon, 解盘 prose, static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Gate — 纳音 lexicon matches the engine's doctrine table
        run: bun run check:nayin
      - name: Gate — 解盘 prose is deterministic (golden file + editorial fence)
        run: bun run check:reading
      - name: Gate — tutor payload carries no birth data; audit catches bad output
        run: bun run check:tutor
      - name: Gate — engine cross-check catches false claims, spares good ones
        run: bun run check:verify
      - name: Static export must build (typechecks the app too)
        run: bun run build
